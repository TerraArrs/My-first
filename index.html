<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3457d5">
  <meta name="description" content="Моё первое простое мобильное приложение">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Моё приложение">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <title>Моё первое приложение</title>
  <style>
    :root { color-scheme: light; --blue: #3457d5; --blue-dark: #2442b2; --ink: #172033; --muted: #5c657a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh; padding: 24px;
      display: grid; place-items: center; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(160deg, #eaf0ff 0%, #f7f8fc 55%, #e7edff 100%); color: var(--ink);
    }
    main {
      width: min(100%, 420px); background: #fff; border: 1px solid #e5e9f4; border-radius: 28px;
      padding: 30px 24px; text-align: center; box-shadow: 0 18px 55px rgba(29, 49, 110, .12);
    }
    .mark { width: 68px; height: 68px; margin: 0 auto 18px; display: grid; place-items: center; border-radius: 22px; background: var(--blue); color: white; font-size: 32px; font-weight: 800; }
    h1 { margin: 0 0 10px; font-size: clamp(26px, 7vw, 34px); line-height: 1.15; }
    .intro { margin: 0 auto 24px; max-width: 290px; color: var(--muted); line-height: 1.5; }
    .counter-label { margin: 0 0 4px; font-size: 14px; color: var(--muted); }
    #count { margin: 0 0 22px; font-size: 56px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
    button { width: 100%; min-height: 52px; border: 0; border-radius: 15px; padding: 14px 18px; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #9bb0ff; outline-offset: 3px; }
    .primary { color: white; background: var(--blue); }
    .primary:active { background: var(--blue-dark); transform: translateY(1px); }
    .secondary { margin-top: 10px; background: #eef1fa; color: #27345d; }
    .foot { margin: 22px 0 0; color: #858da0; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">М</div>
    <h1>Моё приложение</h1>
    <p class="intro">Поздравляю! Это твой первый простой проект. Нажми кнопку и посмотри, что произойдёт.</p>
    <p class="counter-label">Количество нажатий</p>
    <p id="count" aria-live="polite">0</p>
    <button class="primary" id="addButton" type="button">Нажми меня</button>
    <button class="secondary" id="resetButton" type="button">Сбросить счётчик</button>
    <p class="foot">Первый проект · Android и iPhone</p>
  </main>
  <script>
    // Находим элементы на странице по их id.
    const countElement = document.querySelector('#count');
    const addButton = document.querySelector('#addButton');
    const resetButton = document.querySelector('#resetButton');

    // Храним количество нажатий в переменной.
    let count = 0;

    // Когда нажимают главную кнопку, увеличиваем число на 1.
    addButton.addEventListener('click', () => {
      count = count + 1;
      countElement.textContent = count;
    });

    // Когда нажимают сброс, возвращаем число к нулю.
    resetButton.addEventListener('click', () => {
      count = 0;
      countElement.textContent = count;
    });

    // Регистрируем сервис-воркер для кэширования приложения и работы офлайн.
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch((error) => {
          console.error('Не удалось зарегистрировать service worker:', error);
        });
      });
    }
  </script>
</body>
</html>
